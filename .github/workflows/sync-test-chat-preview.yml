name: Sync temporary Test chat preview to main

on:
  push:
    branches: [Test-branch]
    paths:
      - index.html
      - assets/css/styles.css
      - assets/css/raleigh-chat.css
      - assets/js/script.js
      - assets/js/raleigh-chat-config.js
      - assets/js/raleigh-chat-engine.js
      - assets/js/raleigh-chat.js
      - assets/images/chat/**
      - assets/data/featured-videos.json
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-test-chat-preview
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published main site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Read latest Test branch
        run: git fetch --depth=1 origin Test-branch:refs/remotes/origin/Test-branch
      - name: Refresh and publish changed preview files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/sync_test_chat_preview.py
            git add -- raleigh-chat-preview-7b60c5f1e2b94d0ca61fa28d73c43a91
            if git diff --cached --quiet; then
              echo "Preview already matches Test branch"
              exit 0
            fi
            git commit -m "Sync temporary chat preview from Test branch"
            if git push origin HEAD:main; then exit 0; fi
            echo "Main changed while publishing; retrying ($attempt/3)"
          done
          exit 1
